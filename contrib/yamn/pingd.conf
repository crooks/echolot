# Example pingd.conf for an Echolot pinger of yamn remailers.
# Copy it to ~/echolot/pingd.conf and change the first block.
# See pingd.conf(5) (doc/pingd.conf.pod) for all options; this file only
# sets the ones that matter for yamn.

$CONFIG = {
	# --- Your pinger --------------------------------------------------
	# Shown on the stats pages
	'sitename'            => 'example',
	# The pinger's address is <my_localpart>@<my_domain>.  Replies arrive
	# as <my_localpart>+<token>@<my_domain>, so the MTA must deliver
	# plus-addresses to this user (see README.md).
	'my_localpart'        => 'pinger',
	'my_domain'           => 'pinger.example.org',
	'operator_address'    => 'admin@example.org',

	# --- yamn instead of Mixmaster -------------------------------------
	# Echolot runs this as "<mixmaster> -m -S -l <nick>" for every ping.
	'mixmaster'           => '/home/pinger/echolot/contrib/yamn/yamn-ping',
	# The yamn client's directory: Echolot writes the remailer's key to
	# mixhome/pubring.mix before every ping; mixhome/yamn.yml configures
	# how the encrypted ping is sent.
	'mixhome'             => '/home/pinger/yamn',
	# yamn remailers are Type II only: no Cypherpunk pings or chains.
	'do_pings'            => { 'mix' => 1 },
	'which_chainpings'    => { 'mix' => [ qw{mix} ] },

	# --- Faster key updates --------------------------------------------
	# Echolot asks each remailer for its key once a day and rebuilds
	# pubring.mix every 8 hours, so a new key can take ~32 hours to be
	# published.  Ask every 6 hours (72 x 5 minutes) and rebuild hourly.
	'getkeyconf_every_nth_time' => 72,
	'buildkeys'           => 60*60,
	# A remailer is disabled after this many unanswered conf requests:
	# 20 x 6 hours keeps the default of about 5 days.
	'addresses_default_ttl' => 20,

	# --- Web pages ------------------------------------------------------
	# The yamn versions of echolot.html, mlist.html and mlist2.html
	# leave out the empty Type I (Cypherpunk) parts, as on the other yamn
	# pingers.  Echolot replaces the whole 'templates' entry, so all
	# templates must be listed.  Paths are relative to the Echolot
	# directory.
	'templates' => { 'default' => {
		'indexfile'          => 'contrib/yamn/templates/echolot.html',
		'mlist'              => 'contrib/yamn/templates/mlist.html',
		'mlist2'             => 'contrib/yamn/templates/mlist2.html',
		'thesaurusindexfile' => 'templates/thesaurusindex.html',
		'fromlinesindexfile' => 'templates/fromlinesindex.html',
		'rlist'              => 'templates/rlist.html',
		'rlist-rsa'          => 'templates/rlist-rsa.html',
		'rlist-dsa'          => 'templates/rlist-dsa.html',
		'rlist-clear'        => 'templates/rlist-clear.html',
		'rlist2'             => 'templates/rlist2.html',
		'rlist2-rsa'         => 'templates/rlist2-rsa.html',
		'rlist2-dsa'         => 'templates/rlist2-dsa.html',
		'rlist2-clear'       => 'templates/rlist2-clear.html',
		'clist'              => 'templates/clist.html',
	} },

	# --- Robustness -----------------------------------------------------
	# Keep the pid file in /run (created by systemd's RuntimeDirectory and
	# emptied at every boot).  A pid file left over from before a reboot
	# makes "pingd start" refuse to run if its pid is now used by another
	# process.
	'pidfile'             => '/run/echolot/pingd.pid',

	'loglevel'            => 'info',
};
1;
